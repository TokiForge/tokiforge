name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Lint, Test, Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: >
          pnpm
          --filter @tokiforge/core
          --filter @tokiforge/react
          --filter @tokiforge/vue
          --filter @tokiforge/svelte
          --filter @tokiforge/angular
          --filter @tokiforge/nextjs
          --filter @tokiforge/remix
          --filter @tokiforge/astro
          --filter @tokiforge/solid
          --filter @tokiforge/sveltekit
          --filter @tokiforge/storybook
          --filter @tokiforge/tailwind
          --filter @tokiforge/figma
          --filter tokiforge-cli
          run build
